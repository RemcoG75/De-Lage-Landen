<style>
/* Layout: full-screen map canvas; HUD floats on top, choice cards along the bottom. One deliberate world: peat, clay and North Sea grey. */
:root{
  --peat:#2f2920; --peat2:#3d3528; --paper:#f2e4c1; --ink:#2a241b; --clay:#a8693b; --clay2:#6b4424;
  --sea:#3f6f87; --gold:#e8b44a; --moss:#5d7a3f;
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--peat);color:var(--paper);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.res{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(29,25,18,.88);border:2px solid #6b5a3e;border-radius:999px;padding:4px 16px 4px 10px;font:800 28px/1.1 var(--display);display:flex;align-items:center;gap:8px;color:var(--paper)}
.pill svg{width:30px;height:30px}
.storm{gap:10px}
.bar{width:90px;height:14px;border-radius:7px;background:#5a6670;overflow:hidden}
.bar i{display:block;height:100%;background:#cfd8de;border-radius:7px;transition:width .3s}
#era{text-align:center;font-family:var(--display);text-shadow:0 2px 0 rgba(0,0,0,.5);min-width:0}
#era .t{font-size:20px;font-weight:800}
#era .y{font:400 14px var(--body);opacity:.85}
.btns{display:flex;gap:8px}
.btns button{pointer-events:auto;width:50px;height:50px;border-radius:50%;border:2px solid #6b5a3e;background:rgba(29,25,18,.88);color:var(--paper);font:800 22px var(--display);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#note .more{float:right;font-size:14px;opacity:.7}
#note{cursor:pointer}
#note{position:absolute;top:74px;left:0;max-width:min(300px,55%);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;box-shadow:0 4px 0 var(--clay2);pointer-events:auto}
#note h4{margin:0 0 4px;font:800 13px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--clay2)}
#note p{margin:0 0 8px}
#note p:last-child{margin:0}
#note .q{font-weight:700}
#sub{position:absolute;left:50%;transform:translateX(-50%);bottom:122px;max-width:min(560px,90%);text-align:center;font:600 15px/1.35 var(--body);background:rgba(29,25,18,.8);padding:6px 12px;border-radius:10px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:7}
#sub.on{opacity:1}
#sub.top{bottom:auto;top:10px}
#cards{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;pointer-events:none}
.card{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:84px;padding:8px 18px 8px 12px;border-radius:20px;background:var(--paper);color:var(--ink);border:3px solid var(--clay);box-shadow:0 5px 0 var(--clay2);font:800 22px var(--display);cursor:pointer;animation:pop .35s ease-out}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--clay2)}
.card .ic{font-size:44px;line-height:1}
.card .cost{display:flex;align-items:center;gap:3px;font:700 17px var(--body);color:var(--clay2)}
.card .cost svg{width:20px;height:20px}
.card.poor{opacity:.55}
.card .lbl{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,17,12,.72);z-index:8}
.box{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px 26px;max-width:min(520px,92%);box-shadow:0 8px 0 var(--clay2);text-align:center}
.box h1{font:800 44px/1.05 var(--display);margin:0 0 6px;color:var(--clay2);text-wrap:balance}
.box h2{font:800 28px/1.1 var(--display);margin:0 0 4px;text-wrap:balance}
.box .yr{font:700 15px var(--body);color:var(--moss);margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase}
.box p{font-size:16px;line-height:1.45;margin:0 0 12px;text-align:left}
.box .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.lng{display:inline-flex;margin:0 0 14px;border:2px solid var(--clay2);border-radius:999px;overflow:hidden}
.lng button{font:800 17px var(--display);padding:8px 16px;border:0;background:transparent;color:var(--clay2);cursor:pointer}
.lng button[aria-pressed="true"]{background:var(--clay2);color:var(--paper)}
.big{font:800 26px var(--display);padding:14px 30px;border-radius:18px;border:3px solid var(--clay2);background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--clay2);cursor:pointer}
.big.alt{background:transparent;font-size:20px;padding:12px 22px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--clay2)}
.box .lng{margin-bottom:4px}
.box .vh{font:800 14px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--clay2);margin:14px 0 6px;text-align:left}
.vc{display:flex;flex-wrap:wrap;gap:6px}
.vc button{font:700 15px var(--body);padding:8px 12px;border-radius:999px;border:2px solid var(--clay);background:transparent;color:var(--ink);cursor:pointer}
.vc button[aria-pressed="true"]{background:var(--clay2);border-color:var(--clay2);color:var(--paper)}
.box svg.scale{display:block;width:100%;max-width:380px;height:auto;margin:4px auto 12px}
.box figure.photo{margin:4px 0 6px}.box figure.photo img{display:block;width:100%;max-width:360px;margin:0 auto;border-radius:14px;background:#e4e4e4}.box figcaption{font-size:12px;color:#5a4a36;text-align:center;margin-top:6px}
.box a.ext{color:var(--clay2);font-weight:700}
.box p.tip{font-size:13px;color:#5a4a36;margin:12px 0 0}
.box{max-height:calc(100% - 24px);overflow-y:auto;box-sizing:border-box}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.abc button{position:relative;font:800 34px/1 var(--display);padding:12px 0 16px;border-radius:14px;border:3px solid var(--clay);background:#fff8e6;color:var(--ink);box-shadow:0 4px 0 var(--clay2);cursor:pointer}
.abc button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--clay2)}
/* traced letters turn orange, a shade deeper each time (up to three) */
.abc button.lv1{background:#ffe2bd;border-color:#f0a050}
.abc button.lv2{background:#ffbf73;border-color:#e07a1f}
.abc button.lv3{background:#f5901f;border-color:#b85d10;color:#fff}
#trace{position:absolute;inset:0;z-index:6;background:rgba(20,17,12,.8)}
#tSkip{position:absolute;right:0;bottom:12px;font:700 14px var(--body);color:var(--paper);opacity:.45;background:transparent;border:1px solid rgba(242,228,193,.4);border-radius:999px;padding:6px 12px;cursor:pointer}
@media (max-width:600px){#era .t{font-size:16px}.pill{font-size:22px}.btns button{width:44px;height:44px}#note{max-width:80%}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

<div id="app"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="res" id="res"></div>
    <div id="era"><div class="t" id="eraT"></div><div class="y" id="eraY"></div></div>
    <div class="btns">
      <button id="bSay">🔊</button>
      <button id="bInfo">i</button>
      <button id="bMenu" aria-label="Menu">≡</button>
    </div>
  </div>
  <aside id="note"></aside>
  <div id="cards"></div>
  <div id="ov" hidden><div class="box" id="ovBox"></div></div>
  <div id="trace" hidden><canvas id="tcv"></canvas><button id="tSkip">overslaan ›</button></div>
  <div id="sub"></div>
</div></div>

  win7Say:'Hoera! Zeeland is veilig. De Deltawerken beschermen ons tegen de zee.',
  win7Title:'Veilig achter de Deltawerken', win7Sub:'Einde van deel 7',
  win7Html:'<p>Na de ramp van 1953 bouwde Nederland de Deltawerken: dammen, sluizen en stormvloedkeringen. De Oosterscheldekering ging in 1986 in gebruik. Hij staat meestal open, zodat het zoute water en de natuur blijven. Alleen bij zware storm gaan de deuren dicht.</p><p>Van een boomstamkano tot de Deltawerken: tienduizend jaar wonen met het water.</p>',
  n17:(r)=>[`Gered ${r}/6. Vlieg met de helikopter naar de daken waar mensen zwaaien.`,'In de nacht van 31 januari op 1 februari 1953 braken de dijken in Zeeland, Zuid-Holland en West-Brabant. Eerst redden vissers met kleine bootjes mensen van daken en zolders. Daarna kwamen ook helikopters, uit Nederland en andere landen.','Hoe zou het voelen als het water in je huis staat?'],
  n18:(d,ost)=>[`Dammen ${d}/2. Betonblokken haal je bij de fabriek (rechtsboven). Haringvliet: dam van 3 blokken. Oosterschelde: jij kiest, dam (3) of stormvloedkering (6).`,
    !ost?'Eerst zou de Oosterschelde helemaal dicht. Maar dan zou de zoute natuur met mosselen en oesters verdwijnen. Daarom kwam er een kering die normaal openstaat.':'De Westerschelde bleef open: dat is de vaarroute naar de haven van Antwerpen. Daar werden juist de dijken hoger.',
    'Dicht of open: wat zou jij kiezen, en waarom?'],
  n19:['Er komt storm! Vlieg naar de stormvloedkering en tik op Deuren dicht.','Bij de Brouwersdam liet een kabelbaan zo’n 240.000 betonblokken in het water zakken.','Waarom gaan de deuren alleen bij storm dicht?'],
  n20:['Deel 7 is klaar!','De Maeslantkering bij Rotterdam werd in 1997 geopend, als laatste stuk van de Deltawerken. In het Watersnoodmuseum in Ouwerkerk kun je meer zien over 1953.','Waar zouden we nu nog goed op het water moeten letten?'],
  y1840:'ca. 1840', y1852:'1852', haarlemL:'Haarlem', lakeL:'Haarlemmermeer', havenL:'Haven',
  railBtn:'Rails', pumpBtn:'Gemaal',
  coalFirst:'Kolen! Die komen met het schip. Kolen maken vuur, en vuur maakt stoom.', coalShort:['Kolen aan boord!','Nog meer kolen!'],
  coalEmpty:'Het volgende kolenschip is nog onderweg. Vaar even een rondje, of breng de kolen naar een gemaal.',

  railFirst:'Rails van ijzer! Hier gaat de trein over rijden.', railMore:['Nog een stuk spoor!','Het spoor wordt langer!'],
  railDone:'Het spoor is klaar! Tuut tuut, daar rijdt De Arend, de eerste trein van Nederland, van Amsterdam naar Haarlem!',
  pumpStart:'Tik tik tik! We bouwen een gemaal met een grote stoommachine.',

  lakeDry:'Het meer is weg! Nu is het een grote polder, de Haarlemmermeer. Er komen boerderijen en wegen.',
  era6Title:'Deel 6: Stoom en de eerste trein',
  era6Html:'<p>Het Haarlemmermeer is een groot, wild meer dat bij storm steeds meer land wegspoelt. Molens kunnen het niet leegpompen, de nieuwe stoommachines wel. En tussen Amsterdam en Haarlem komt de eerste spoorlijn.</p><p><b>Doel:</b> leg het spoor (7 stukken) en maal het meer droog met drie stoomgemalen. Jij kiest: eerst het spoor, dan haalt de trein meer kolen per keer, of meteen gemalen bouwen. Je kind vaart kolen, timmert rails en stookt de machines.</p>',
  toMeer:'Naar het Haarlemmermeer',
  era6Narr:'Dit was bijna tweehonderd jaar geleden. Kijk, een stoomboot! Stoommachines werken op kolen. Ze kunnen veel harder pompen dan molens. Het grote meer eet steeds meer land op. Daar gaan we wat aan doen! En we leggen een spoor voor de eerste trein.',
  win6Say:'Hoera! De trein rijdt en het meer is droog. Wat een stoomkracht!',
  win6Title:'Stoomkracht!', win6Sub:'Einde van deel 6',
  win6Html:'<p>Met stoommachines lukte wat met wind niet ging. Drie stoomgemalen maalden tussen 1849 en 1852 het Haarlemmermeer droog. En in 1839 reed de eerste trein van Amsterdam naar Haarlem.</p><p>Volgende keer: de storm van 1953 en de Deltawerken.</p>',
  n15:(r,p,lake,coal)=>[`Spoor ${r}/7 · gemalen ${p}/3. Kolen uit de haven → naar een gemaal, dan pompt het. Na een kort rondje komt er een nieuw kolenschip. Spoor klaar: 6 kolen per keer.`,
    p===0?'Het Haarlemmermeer werd steeds groter. Na twee zware stormen in 1836 besloot men het droog te malen.':lake>0?'Er kwamen drie stoomgemalen: Leeghwater, Cruquius en Lynden. Tussen 1849 en 1852 pompten ze het meer leeg.':'Op 20 september 1839 reed de locomotief De Arend van Amsterdam naar Haarlem. Een kopie staat in het Spoorwegmuseum in Utrecht.',
    p===0?'Waarom zou je het meer droog willen maken?':r<7?'Wat is slimmer: eerst het spoor, of eerst pompen?':'Hoe zou het zijn om in die eerste trein te zitten?'],
  n16:['Deel 6 is klaar!','De Haarlemmermeerpolder is ongeveer 18.000 hectare groot. Schiphol ligt er nu in, op de bodem van het oude meer. Gemaal De Cruquius is een museum: je kunt de grote stoommachine nog zien.','Wat staat er nu op plekken waar vroeger water was?'],

  woodPort:'Noorwegen! Hier halen we hout uit de grote bossen.', woodPortShort:['Hout aan boord!','Het schip zit vol hout!'],
  grainPort:'De Oostzee! Hier laden we graan.', grainPortShort:['Graan aan boord!','Het ruim zit vol graan!'],

  sell:'We brengen het graan naar het pakhuis. Dat levert munten op!', sellShort:['Munten!','Weer munten verdiend!'],
  houseStart:'Eerst palen in de grond, anders zakt het huis weg in de zachte bodem. Tik tik tik, heien maar!',
  houseFirst:'Een huis aan de gracht! Het staat stevig op palen.', houseMore:['Nog een grachtenhuis!','De gracht wordt mooi vol!'],
  stadStart:'Het stadhuis wordt heel groot en zwaar. Daar zijn heel veel palen voor nodig. Tik maar flink!',
  stadDone:'Het stadhuis op de Dam is klaar! Tegenwoordig is het een paleis van de koning.',

  needCoin:'We hebben meer munten nodig. Haal graan uit de Oostzee en breng het naar het pakhuis.',
  era5Title:'Deel 5: De Gouden Eeuw in Amsterdam',
  era5Html:'<p>Amsterdam groeit snel. Met het fluitschip halen handelaars graan uit de Oostzee en hout uit Noorwegen. De stad krijgt nieuwe grachten, en elk huis komt op houten palen in de zachte grond.</p><p><b>Doel:</b> vier grachtenhuizen en het stadhuis op de Dam. Jij beslist wat je koopt: meteen bouwen, of eerst een zaagmolen zodat elke reis meer hout oplevert. Je kind vaart en heit de palen.</p>',
  toAmsterdam:'Naar Amsterdam',
  era5Narr:'Kijk eens hoe groot Amsterdam is geworden! Ons nieuwe schip is een fluitschip. Daarmee varen we heel ver: naar Noorwegen voor hout, en naar de Oostzee voor graan. Van het hout bouwen we huizen aan de grachten.',
  win5Say:'Hoera! De grachten staan vol mooie huizen en het stadhuis is klaar. Amsterdam is een van de rijkste steden van de wereld!',
  win5Title:'De Gouden Eeuw!', win5Sub:'Einde van deel 5',
  win5Html:'<p>In de zeventiende eeuw was Amsterdam een van de rijkste steden van de wereld. Schepen brachten graan, hout en specerijen. De stad groeide met de grachtengordel, en het stadhuis op de Dam werd gebouwd op 13.659 houten palen.</p><p>Volgende keer: stoom en de eerste trein.</p>',
  n13:(h,stad,saw,c)=>[`Huizen ${h}/4 · stadhuis ${stad?'✓':'nog niet'}. Hout uit Noorwegen (links), graan uit de Oostzee (rechts). Graan wordt munten in het pakhuis. Met een zaagmolen geeft elke reis 5 hout in plaats van 3.`,
    h===0?'Het fluitschip werd rond 1595 in Hoorn ontworpen. Het nam veel lading mee met weinig bemanning, en was daardoor goedkoop om mee te varen.':!saw?'Rond 1594 bouwde Cornelis Corneliszoon de eerste houtzaagmolen. Daarmee zaagde je hout veel sneller dan met de hand.':h<4?'Graan uit de Oostzee was zo belangrijk dat Amsterdammers het de moedernegotie noemden: de moeder van alle handel.':'Het stadhuis op de Dam werd gebouwd tussen 1648 en 1665, op 13.659 houten palen. Nu is het het Koninklijk Paleis.',
    h===0?'Wat zou jij gaan halen met het schip?':!saw?'Is het slim om eerst een zaagmolen te bouwen?':'Waarom staan de huizen op palen?'],
  n14:['Deel 5 is klaar!','De grachtengordel werd vanaf 1613 aangelegd en staat sinds 2010 op de Werelderfgoedlijst. De Gouden Eeuw had ook een donkere kant: de VOC en de WIC voerden oorlog en handelden in tot slaaf gemaakte mensen.','Wat vind jij het mooiste aan de stad?'],
  canoeTitle:'De Kano van Pesse', canoeYr:'ca. 8000 v.Chr. · de oudste boot ter wereld',
  canoeKid:'Dit is de kano van Pesse. Hij is gemaakt van één boomstam, uitgehold met stenen gereedschap. Hij is tienduizend jaar oud: de oudste boot van de hele wereld! Hij is ongeveer drie meter lang, zo lang als drie kinderen achter elkaar. Je kunt hem echt gaan bekijken, in het museum in Assen.',
  canoeHtml:'<p><b>Gevonden:</b> in 1955, bij de aanleg van de A28 bij Pesse, zo’n twee meter diep in het veen. De kraanmachinist dacht dat het een boomstam was. Boer Hendrik Wanders zag dat het meer was en liet hem onderzoeken.</p><p><b>Hoe oud:</b> volgens koolstofdatering gemaakt tussen 8040 en 7510 v.Chr.</p><p><b>Gemaakt van:</b> één stam van een grove den, uitgehold met gereedschap van vuursteen of gewei.</p><p><b>Maat:</b> 298 cm lang, 44 cm breed.</p><p><b>Werkt hij echt?</b> In 2001 bouwde archeoloog Jaap Beuker een precieze kopie. Een kanovaarder kon daar gewoon mee varen.</p><p><b>Zien:</b> in het Drents Museum in Assen.</p>',
  canoeLink:'Meer over de kano ↗ (Wikipedia, Engels)', photoCap:'De echte kano, nu in het Drents Museum · foto: Drents Museum', backMap:'Terug naar de kaart', svgLen:'3 meter', svgYou:'jij',

  ringGap:'Storm! Er zit nog een gat in de dijk. Het water vindt altijd een gat!',

  damStart:'Tik tik tik! We leggen een dam in de rivier.',
  damDone:'Een dam in de Amstel. Amstel, dam... Amsterdam! Zo kreeg de stad haar naam.',

  kampenHi:'Dit is Kampen, een handelsstad. Bouw eerst Amsterdam, dan hebben we iets om te verkopen.',
  hanzeTrade:'We brengen kaas en boter uit Holland, en krijgen graan en hout terug. Zo werd Holland rijk!',
  era4Title:'Deel 4: Dijken en molens in Holland',
  era4Html:'<p>In Holland is het land nat veen. Bij storm komt de zee over het land. Mensen gaan samen dijken bouwen, dammen in rivieren leggen en later molens zetten om het water weg te pompen. Zo ontstaat de polder.</p><p><b>Doel:</b> maak de dijk dicht (4 stukken dijk en een dam in de Amstel), maal de polder droog met een molen, en vaar met de kogge naar Kampen om te handelen. Jij kiest de volgorde; je kind vaart, sjouwt en bouwt.</p>',
  toHolland:'Naar Holland',
  era4Narr:'Heel veel jaren later. Kijk, ons nieuwe schip: een kogge! Hier in Holland is het land nat en zacht. Bij storm komt de zee over het land. Haal klei van de kwelder, dan bouwen we een dijk.',
  win4Say:'Hoera! Holland is droog, Amsterdam is gebouwd en de kogge vaart. Goed gedaan!',
  win4Title:'Holland is droog!', win4Sub:'Einde van deel 4',
  win4Html:'<p>Met dijken, dammen en molens maakten mensen van nat veen droog land: polders. Amsterdam begon als een dam in de Amstel, rond 1270. De waterschappen die op de dijken letten, bestaan nu nog steeds.</p><p>Volgende keer: de Gouden Eeuw, met het fluitschip.</p>',
  n8done:['Deel 3 is klaar. Tik op "Verder in de tijd" voor de Middeleeuwen.','Rond het jaar 1000 begonnen boeren het natte veen in Holland te ontginnen. Ze groeven sloten om het water af te voeren.','Wat heb je nodig om in nat land te wonen?'],
  n9:(d,dam)=>[`Dijk ${d}/4 · dam ${dam?'✓':'nog niet'}. Een stuk dijk kost 2 klei, de dam in de Amstel 3 klei. Gestippelde vakjes laten zien waar. Klei ligt op de kwelder buiten de dijk. Zolang er een gat is, loopt de polder bij storm onder.`,'Rond 1250 gingen boeren in Holland samen dijken bouwen en onderhouden. Daaruit ontstonden de waterschappen. Die bestaan nu nog steeds.','Wat gebeurt er als er één gaatje in de dijk zit?'],
  n10:['De dijk is dicht. Bouw een molen (3 hout) op een plek in de polder. De molen pompt het water weg.','Veen zakt in als je het droogmaakt. Daardoor ligt veel van Holland nu onder zeeniveau. Rond 1400 kwamen de eerste windmolens om polders droog te malen.','Waar gaat het water heen dat de molen wegpompt?'],
  n11:['Vaar met de kogge naar Kampen, aan de overkant van de Zuiderzee, en tik op Handelen.','Kampen was een Hanzestad. Met koggen voeren handelaars over de Zuiderzee naar de Oostzee. In Kampen ligt een nagebouwde kogge.','Wat zou jij in je schip laden?'],
  n12:['Deel 4 is klaar!','Amsterdam is genoemd naar de dam in de Amstel. De stad wordt rond 1275 voor het eerst genoemd.','Welke stad zou jij een naam geven?'],

  era2Title:'Part 2: Terps in Friesland',
  era2Html:'<p>The sea level is rising. On the salt marshes along the coast the grass is rich, but in a storm the land floods. People start living on hills they build themselves out of clay and dung: terps.</p><p><b>Goal:</b> three farms on terps that stay dry through a storm together. You decide where to build; your child sails and stacks.</p>',
  toFriesland:'To Friesland',
  era2Narr:'Many, many years later. Now we live by the sea, in Friesland. The grass here is good for the cows. But sometimes the sea comes over the land. Sail the boat and look for clay. With clay we build a hill. It is called a terp.',
  winSay:'Hooray! All the terps stayed dry. People lived like this for more than a thousand years, until they started building dykes.',
  winTitle:'High and dry!', winSub:'End of part 2',
  winHtml:'<p>You went from wandering hunters with a dugout canoe to farmers with fields, cows and a hunebed, and then to terp dwellers by the sea.</p><p>But visitors are coming from the south: the Romans.</p>',
  era3Title:'Part 3: The Romans on the Rhine',
  era3Html:'<p>The Romans conquer the south of the Netherlands. Around AD 47 the Rhine becomes the northern border of the Roman Empire. Forts and a road appear along the river: the Limes.</p><p><b>Goal:</b> three forts on the south bank, three pieces of road, and a trade with the Frisians across the river. You choose where the forts go, not too close together. Your child sails, carries and builds.</p>',
  toRhine:'To the Rhine',
  era3Narr:'Look, who is that coming? The Romans! They come from very far away, from Italy. They have a big flat boat. The river Rhine becomes the border. Fetch wood from the forest, and we will build forts along the river.',
  win3Say:'Hooray! The forts are standing, the road is built, and we trade with the Frisians. This was the border of the Roman Empire.',
  win3Title:'The Limes stands!', win3Sub:'End of part 3',
  win3Html:'<p>Along the Rhine stood a row of forts with a road between them: the Limes. The Romans stayed in the Netherlands for about four hundred years. Since 2021 the Limes has been a World Heritage Site.</p><p>Next time: the Middle Ages, with dykes, windmills and the cog.</p>',
  playAgain:'Play again', lookAround:'Look around',
  era1Title:'Part 1: Hunters in Drenthe',
  era1Html:'<p>There are no houses, roads or towns yet. People move from place to place to hunt, fish and gather berries.</p><p><b>How to play together:</b> your child taps the map to paddle and collect. You choose the big things: where to settle and what to discover. With every discovery your child traces a letter. Think out loud, so your child learns to think along.</p>',
  start:'Start',
  era1Narr:'Long, long ago, ten thousand years back, there were no houses and no towns. People wandered about looking for food. We have a canoe made from a tree trunk! Tap the map, and we\'ll paddle there.',
  forYou:'For you', ask:'Ask',
  n1:['Explore by canoe and collect 3 food (deer, fish, berries). Then choose a place on land to live, together.','The Pesse canoe, found in Drenthe, is about 10,000 years old and the oldest known boat in the world. It is on display in the Drents Museum in Assen.','Where would you live: in the wet bog or on the dry sand?'],
  n2:['Make a field (3 food). Fields and cows produce food on their own while your child paddles about.','Around 4000 BC people in this region started farming. That meant they stayed in one place.','What is easier: hunting every day, or growing grain?'],
  n3:['Get a cow (4 food). More fields work too.','Cows gave milk, meat, leather, and dung for the fields.','What do we get from a cow?'],
  n4:['Build a hunebed (6 food) close to the hut. Then your child taps the stones into place.','Hunebedden (dolmens) were built as graves around 3400 to 3000 BC. There are 54 left in the Netherlands, 52 of them in Drenthe.','How did they move those heavy stones without cars or cranes?'],
  n5:['Part 1 is done. Tap "Forward in time".','More than 2,500 years separate the hunebedden from the terps.','What do you think changes when the water rises?'],

  const fat=Lh*.15;

    else{const hp=pointAt(st,tr.prog);c.fillStyle='#4f9a3a';c.beginPath();c.arc(hp[0],hp[1],Lh*.05,0,7);c.fill()}
    // demo finger when idle
    const idle=now-tr.lastMove;if(idle>2600){const ph2=((idle-2600)%2200)/2200,p=pointAt(st,ph2*st.len);
      c.font=`${Lh*.16}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;c.textAlign='left';c.textBaseline='top';c.globalAlpha=.85;c.fillText('👆',p[0]-Lh*.04,p[1]-Lh*.01);c.globalAlpha=1}
  }else{
    // the word, first letter highlighted
    const k=Math.min(1,(now-tr.doneAt)/400),word=tr.word.toUpperCase(),fs=Lh*.2;c.font=`800 ${fs}px Grandstander, sans-serif`;c.textBaseline='middle';
    const wTot=c.measureText(word).width;let x=W/2-wTot/2;const y=g.ly+Lh*1.22;c.globalAlpha=k;
    for(let i=0;i<word.length;i++){c.fillStyle=i===0?'#a8693b':'#2a241b';c.textAlign='left';c.fillText(word[i],x,y);x+=c.measureText(word[i]).width}
    c.globalAlpha=1;
  }
}

/* ---------- game flow ---------- */
function tapMove(x,y){target={x,y};if(!anim)advance()}
function nextStep(){
  const u=s.unit;if(!target)return null;const dx=Math.sign(target.x-u.x),dy=Math.sign(target.y-u.y);if(!dx&&!dy)return null;
  for(const [a,b] of [[dx,dy],[dx,0],[0,dy]]){if((a||b)&&passable(u.x+a,u.y+b))return [u.x+a,u.y+b]}
  return 'blocked';
}
function advance(){
  const n=nextStep();if(n===null){target=null;return}
  if(n==='blocked'){target=null;if(s.era===1){sfx.no();say('blocked')}return}
  anim={fx:s.unit.x,fy:s.unit.y,t0:performance.now()};s.unit.x=n[0];s.unit.y=n[1];sfx.step();
}
function step(){
  s.steps++;const u=s.unit;reveal(u.x,u.y,1);
  if(s.era===1&&tile(u.x,u.y)==='V')once('veen','veen');
  if(s.era===3){const o=s.obj[key(u.x,u.y)];if(o&&o.kind==='fries'&&!s.traded){if(fortsDone())once('fries2','friesHi2');else once('fries1','friesHi')}}
  if(s.era===4&&isAt(KAMPEN,u.x,u.y)&&!damDone())once('kampen1','kampenHi');
  if(s.era===5)arrive5(u.x,u.y);
  if(s.era===6)arrive6(u.x,u.y);
  if(s.era===7)arrive7(u.x,u.y);
  collect();produce();if(s.steps%3===0)spawn();if(s.era===2||s.era===4)storm();
  refresh();save();
}
function collect(){
  const k=key(s.unit.x,s.unit.y),r=s.res[k];if(!r)return;delete s.res[k];sfx.get();
  if(r==='clay'){s.clay++;float(s.unit.x,s.unit.y,'+1','clay');
    if(s.era===4){if(!once('clay4','clay4First'))say('clayShort');return}
    if(!once('clay','clayFirst'))say('clayShort');
    if(s.clay>=3)once('clay3','clay3');return}
  if(r==='wood'||r==='stone'){s[r]++;float(s.unit.x,s.unit.y,'+1',RES_ICON[r]);if(!once(r,'first_'+r))say('short_'+r);return}
  s.food++;float(s.unit.x,s.unit.y,'+1','🍖');
  if(!s.village&&s.food===3){say('food3');s.said.food3=1;return}
  if(!once(r,'first_'+r))say('short_'+r);
}
function produce(){
  if(s.era!==1)return;let got=0;
  if(s.steps%6===0)for(const k in s.obj)if(s.obj[k].kind==='field'){const [x,y]=k.split(',').map(Number);s.food++;got++;float(x,y,'+1','🍖')}
  if(s.steps%5===0)for(const c of s.cows){s.food++;got++;float(c.x,c.y,'+1','🍖')}
  if(got){tone(784,.15,'triangle',.08);once('harvest','harvest')}
}
function spawn(){
  const vals=Object.values(s.res),n=vals.length,max=s.era===1?6:5;if(n>=max)return;const c=[];
  if(s.era>=5)return;
  let wantStone=false;if(s.era===3){const st=vals.filter(v=>v==='stone').length,wd=vals.filter(v=>v==='wood').length;wantStone=st<2&&(wd>=2||Math.random()<.5)}
  if(s.era===4){const cl=vals.filter(v=>v==='clay').length,wd=vals.filter(v=>v==='wood').length,wantClay=cl<3&&(wd>=2||Math.random()<.6);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const k=key(x,y);if(s.obj[k]||s.res[k]||(x===s.unit.x&&y===s.unit.y))continue;
      if(wantClay?tile(x,y)==='K':tile(x,y)==='B')c.push([k,wantClay?'clay':'wood'])}
    if(c.length){const [k,r]=pick(c);s.res[k]=r}return}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const k=key(x,y);if(s.obj[k]||s.res[k]||(x===s.unit.x&&y===s.unit.y))continue;const tt=tile(x,y);
    if(s.era===1){if(!s.fog[y*COLS+x])continue;if(Math.max(Math.abs(x-s.unit.x),Math.abs(y-s.unit.y))>5)continue;
      if(tt==='H')c.push([k,'deer']);if(tt==='B')c.push([k,pick(['deer','berry'])]);if(tt==='R')c.push([k,'fish'])}
    else if(s.era===2){if((tt==='K'||(tt==='L'&&y<=3))&&!isFlooded(x,y))c.push([k,'clay'])}
    else{if(wantStone){if(tt==='R'&&x>=10)c.push([k,'stone'])}else if(tt==='B')c.push([k,'wood'])}
  }
  if(c.length){const [k,r]=pick(c);s.res[k]=r}
}
function storm(){
  if((s.era===2&&s.won2)||(s.era===4&&(s.won4||s.dry)))return;
  if(s.flood>0){s.flood--;if(s.flood===0)afterStorm();return}
  const left=s.stormAt-s.steps;
  if(left===4){sfx.thunder();say(s.era===4?(ringClosed()?'stormWarn4':'stormWarn4'):'stormWarn')}
  if(left<=0)startFlood();
}
function startFlood(){
  if(s.era===4){s.flood=4;sfx.thunder();setTimeout(sfx.thunder,700);
    if(ringClosed()){say('ringHolds');return}
    for(const k in s.obj){const o=s.obj[k],[x,y]=k.split(',').map(Number);if(o.kind==='farm'&&inPolder(x,y))o.wet=true}
    for(const k in s.res){const [x,y]=k.split(',').map(Number);if(isFlooded(x,y))delete s.res[k]}
    say('ringGap');return}
  s.flood=4;let wet=0;sfx.thunder();setTimeout(sfx.thunder,700);
  for(const k in s.obj){const o=s.obj[k],[x,y]=k.split(',').map(Number);if(o.kind==='farm'&&isFlooded(x,y)&&o.terp<TERP_MAX&&o.house){o.wet=true;wet++}}
  for(const k in s.res){const [x,y]=k.split(',').map(Number);if(isFlooded(x,y))delete s.res[k]}
  s.lastWet=wet>0;say(wet?'floodWet':'floodDry');
}
function afterStorm(){
  if(s.era===4){s.stormAt=s.steps+16;if(!ringClosed())say('stormOver4');return}
  s.stormAt=s.steps+14;const dry=Object.values(s.obj).filter(o=>o.kind==='farm'&&o.terp>=TERP_MAX&&!o.wet).length;
  if(dry>=3){win2();return}
  say(s.lastWet?'stormOverWet':'stormOver');
}

/* ---------- actions ---------- */
function settle(){
  const u=s.unit;s.village={x:u.x,y:u.y};s.obj[key(u.x,u.y)]={kind:'hut'};s.yk='y4000';sfx.done();burst(u.x,u.y);refresh();save();
  letterThen('dorp','D','dorp','🛖',false,()=>say('settle'));
}
const near=(x,y,r)=>s.village&&Math.max(Math.abs(x-s.village.x),Math.abs(y-s.village.y))<=r&&!(x===s.village.x&&y===s.village.y);
const validField=(x,y)=>inB(x,y)&&near(x,y,1)&&'LHB'.includes(tile(x,y))&&!s.obj[key(x,y)];
const validHune=(x,y)=>inB(x,y)&&near(x,y,2)&&'LHB'.includes(tile(x,y))&&!s.obj[key(x,y)];
function addCow(){
  const v=s.village,spots=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=v.x+dx,y=v.y+dy;if((dx||dy)&&inB(x,y)&&'LHB'.includes(tile(x,y))&&!s.obj[key(x,y)])spots.push({x,y})}
  const c=spots[s.cows.length%Math.max(1,spots.length)]||{x:v.x,y:v.y};s.cows.push({x:c.x,y:c.y});
}
const portReady=name=>s.lastPort!==name||s.steps-(s.portAt||0)>=6;
function loadedAt(name){s.lastPort=name;s.portAt=s.steps}
function needLine(res){return s.era===5&&res==='wood'?'needWood5':{food:'needFood',clay:'needClay',wood:'needWood',stone:'needStone',coin:'needCoin',grain:'needCoin',coal:'needCoal',beton:'needBeton'}[res]}
function buy(cost,res,fn){if(s[res]<cost){sfx.no();say(needLine(res));return}fn()}
function buyAll(costs,fn){const miss=costs.find(([n,r])=>s[r]<n);if(miss){sfx.no();say(needLine(miss[1]));return}costs.forEach(([n,r])=>s[r]-=n);fn()}
function startTerp(){
  const u=s.unit,k=key(u.x,u.y);s.clay-=3;
  if(!s.obj[k])s.obj[k]={kind:'farm',terp:0,house:false,wet:false};else s.obj[k].terp=0;
  mode={type:'build',k};say('terpStart');refresh();save();
}
function startFort(){
  const u=s.unit,k=key(u.x,u.y);s.wood-=3;s.obj[k]={kind:'fort',p:0};mode={type:'build',k};say('fortStart');refresh();save();
}
function placeRoad(){
  const u=s.unit,k=key(u.x,u.y);s.stone--;s.obj[k]={kind:'road'};sfx.thud();burst(u.x,u.y);refresh();save();
  const n=count('road'),after=()=>{say(n===1?'roadFirst':'roadMore');checkWin3()};
  if(n===1)letterThen('weg','W','weg','🛤️',false,after);else after();
}
function doTrade(){
  const u=s.unit;s.traded=true;sfx.get();float(u.x,u.y,'🪙','🐄');
  const fs=fortList().filter(f=>f.o.p>=5).sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y));
  if(fs[0])s.cows.push({x:fs[0].x,y:fs[0].y});refresh();save();

// era 4 actions
function startBuild(kind,cost,res,line){const u=s.unit,k=key(u.x,u.y);s[res]-=cost;s.obj[k]={kind,p:0};mode={type:'build',k};say(line);refresh();save()}
function dryFarms(){for(const o of Object.values(s.obj))if(o.kind==='farm')o.wet=false;s.flood=0}
function afterRingPiece(line,...a){
  if(ringClosed()&&!s.ringSaid){s.ringSaid=true;dryFarms();say('ringClosed')}else say(line,...a);
  refresh();save();checkWin4();

function drain(){
  if(s.dry||!ringClosed()||!millDone())return;
  const m=Object.entries(s.obj).find(([,o])=>o.kind==='mill'),[mx,my]=m[0].split(',').map(Number),wet=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(MAP4[y][x]==='V'&&tile(x,y)==='V')wet.push([x,y,Math.hypot(x-mx,y-my)]);
  wet.sort((a,b)=>a[2]-b[2]).slice(0,2).forEach(([x,y])=>{s.map[y]=s.map[y].slice(0,x)+'L'+s.map[y].slice(x+1)});
  if(wet.length<=2){s.dry=true;s.yk='y1400';
    const spots=[];for(let y=4;y<=6;y++)for(let x=1;x<=8;x++)if(inPolder(x,y)&&!s.obj[key(x,y)])spots.push({x,y});
    for(let i=0;i<3&&spots.length;i++)s.cows.push(spots.splice(Math.floor(Math.random()*spots.length),1)[0]);
    sfx.done();letterThen('polder','P','polder','🐄',false,()=>{say('polderDry');checkWin4()})}

function doTrade4(){
  const u=s.unit;s.traded4=true;sfx.get();float(u.x,u.y,'🧀','🌾');refresh();save();say('hanzeTrade');checkWin4();
}
// era 5: ports, warehouse, canal houses
const housesDone=()=>Object.values(s.obj).filter(o=>o.kind==='gracht'&&o.p>=6).length;
const stadDone=()=>{const o=objAt(DAM5);return !!(o&&o.kind==='stadhuis'&&o.p>=10)};
function validHouse(x,y){
  if(s.era!==5||!inB(x,y)||tile(x,y)!=='Q'||s.obj[key(x,y)])return false;
  if([NORWAY,BALTIC,PAKHUIS,ZAAN,DAM5].some(p=>isAt(p,x,y)))return false;

// era 6: coal, rails, steam pumping stations
const railsDone=()=>RAILS6.filter(p=>{const o=objAt(p);return o&&o.kind==='rail'&&o.p>=2}).length;
const pumpList=()=>PUMPS6.map(p=>({p,o:objAt(p)})).filter(q=>q.o&&q.o.kind==='gemaal');
const pumpsDone=()=>pumpList().filter(q=>q.o.p>=6).length;
function lakeLeft(){let n=0;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tile(x,y)==='M')n++;return n}
function validRail(x,y){
  if(s.era!==6||s.obj[key(x,y)]||!RAILS6.some(p=>isAt(p,x,y)))return false;
  return [[1,0],[-1,0]].some(([a])=>{const o=s.obj[key(x+a,y)];return isAt(HAARLEM,x+a,y)||isAt(AMS6,x+a,y)||(o&&o.kind==='rail'&&o.p>=2)});
}
const validPump=(x,y)=>s.era===6&&!s.obj[key(x,y)]&&PUMPS6.some(p=>isAt(p,x,y));
function arrive6(x,y){
  if(isAt(HAVEN,x,y)){
    if(!portReady('haven')){say('coalEmpty');return}
    loadedAt('haven');const n=s.rail?6:4;s.coal+=n;sfx.get();float(x,y,'+'+n,'⚫');if(!once('coal','coalFirst'))say('coalShort');return}
  const o=s.obj[key(x,y)];
  if(PUMPS6.some(q=>isAt(q,x,y))&&s.lastPort==='haven')s.lastPort='pump';
  if(o&&o.kind==='gemaal'&&o.p>=6&&s.coal>0&&!s.dry6){o.fuel=(o.fuel||0)+s.coal*3;s.coal=0;s.lastPort='pump';sfx.get();float(x,y,'🔥','');if(!once('feed','feed'))say('feedShort')}
}
function drain6(){
  let changed=false;
  for(const {p,o} of pumpList()){if(o.p<6||!(o.fuel>0))continue;
    let best=null,bd=1e9;for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(tile(x,y)==='M'){const d=Math.hypot(x-p[0],y-p[1]);if(d<bd){bd=d;best=[x,y]}}
    if(!best)break;s.map[best[1]]=s.map[best[1]].slice(0,best[0])+'L'+s.map[best[1]].slice(best[0]+1);o.fuel--;changed=true}
  if(changed&&lakeLeft()===0&&!s.dry6){s.dry6=true;s.yk='y1852';pumpList().forEach(q=>q.o.fuel=0);
    for(const [x,y] of [[4,4],[7,5],[5,6]])if(!s.obj[key(x,y)])s.obj[key(x,y)]={kind:'farm',terp:0,house:true,wet:false};
    s.cows.push({x:6,y:4},{x:3,y:5});sfx.done();
    letterThen('droog','D','droog','🌾',true,()=>{say('lakeDry');checkWin6()})}
  return changed;
}
function checkWin6(){if(!s.won6&&s.rail&&s.dry6)setTimeout(win6,2600)}
setInterval(()=>{if(s&&s.era===6&&!s.dry6&&!tr&&$('ov').hidden&&drain6()){refresh();save()}},650);

    refresh();save();return}
  if(o.kind==='gemaal'){o.p++;if(o.p>=6){mode=null;sfx.done();burst(x,y);
      if(pumpsDone()===1)letterThen('gemaal','G','gemaal','🏭',true,()=>say('pumpFirst'));else say('pumpMore')}

    refresh();save();return}

function cardList(){

      if(!s.obj[k]&&isAt(DAM7B,u.x,u.y)){L.push({id:'dam7b',ic:'🧱',label:t('damBtn7'),costs:[[3,'beton']],fn:place('dam7',3,'damStart7')});

        L.push({id:'close',ic:'🔒',label:t('closeBtn'),fn:()=>{s.gates='closed';sfx.thud();setTimeout(sfx.thud,250);say('closed');s.stormLeft=Math.min(s.stormLeft,4);refresh();save()}});
    }
  }else if(s.era===6){
    if(s.won6){L.push({id:'verder7',ic:'⏳',label:t('forward'),fn:toEra7Intro});return L}
    const place=(kind,line)=>()=>{s.obj[k]={kind,p:0,fuel:0};mode={type:'build',k};say(line);refresh();save()};

  }else if(s.era===5){
    if(s.won5){L.push({id:'verder6',ic:'⏳',label:t('forward'),fn:toEra6Intro});return L}
    const o=s.obj[k],place=(kind,line)=>()=>{s.obj[k]={kind,p:0};mode={type:'build',k};say(line);refresh();save()};
    if(!o&&isAt(ZAAN,u.x,u.y)&&!s.saw)L.push({id:'saw',ic:'🪚',label:t('sawBtn'),costs:[[3,'coin']],fn:()=>buyAll([[3,'coin']],place('zaag','sawStart'))});

  }else{
    if(s.won3){L.push({id:'verder4',ic:'⏳',label:t('forward'),fn:toEra4Intro});return L}
    const o=s.obj[k];
    if(o&&o.kind==='fries'&&!s.traded&&fortsDone()>=1)L.push({id:'trade',ic:'🤝',label:t('tradeBtn'),fn:doTrade});

  return L;
}

// html and btns are functions so the overlay can re-render in the other language
function overlay(html,btns,withLang){
  ovRebuild=()=>overlay(html,btns,withLang);
  const box=$('ovBox');
  const lng=(withLang==='menu'?`<div class="vh" style="text-align:center;margin-top:0">${t('gameLangH')}</div>`:'')+(withLang?`<div class="lng" role="group" aria-label="Language / Taal"><button data-l="nl" aria-pressed="${lang==='nl'}">Nederlands</button><button data-l="en" aria-pressed="${lang==='en'}">English</button></div>`:'');
  box.innerHTML=lng+html()+'<div class="row"></div>';
  box.querySelectorAll('.lng button').forEach(b=>b.onclick=()=>{initAudio();setLang(b.dataset.l);ovRebuild()});
  box.querySelectorAll('[data-ll]').forEach(b=>b.onclick=()=>{initAudio();setLetterLang(b.dataset.ll);speak(b.dataset.ll==='en'?'C is for canoe.':'De kaa van kano.',true);ovRebuild()});
  box.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{initAudio();$('ov').hidden=true;ovRebuild=null;practice(b.dataset.letter)});
  box.querySelectorAll('[data-voice]').forEach(b=>b.onclick=()=>{initAudio();const tg=b.dataset.tag;try{localStorage.setItem('lagelanden-voice-'+tg,b.dataset.voice)}catch(e){}
    pickVoice();const nl=tg==='nl-NL',forLetters=tg===letterTag()&&tg!==STR[lang].tag;speak(nl?'Hallo! Zullen we gaan varen? De kaa van kano.':'Hello! Shall we go sailing? C is for canoe.',forLetters);ovRebuild()});
  const row=box.querySelector('.row');
  for(const b of btns()){const el=document.createElement('button');el.className='big'+(b.alt?' alt':'');el.textContent=b.label;
    el.onclick=()=>{initAudio();$('ov').hidden=true;ovRebuild=null;b.fn()};row.appendChild(el)}
  $('ov').hidden=false;
}
let cardSig='';
function refresh(){
  if(!s)return;
  const res=$('res');
  if(s.era===1)res.innerHTML=`<div class="pill">🍖 ${s.food}</div>`;
  else if(s.era===2){const left=Math.max(0,s.stormAt-s.steps),frac=s.flood>0?1:Math.min(1,1-left/14);
    res.innerHTML=`<div class="pill">${CLAY_SVG} ${s.clay}</div>`+(s.won2?'':`<div class="pill storm" title="Storm">⛈️<span class="bar"><i style="width:${Math.round(frac*100)}%"></i></span></div>`)}
  else if(s.era===3)res.innerHTML=`<div class="pill">🪵 ${s.wood}</div><div class="pill">🪨 ${s.stone}</div>`;
  else{const left=Math.max(0,s.stormAt-s.steps),frac=s.flood>0?1:Math.min(1,1-left/16);

function start(data){
